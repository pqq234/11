<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>多聚吃瓜 · 超级聚合</title>
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
:root{
  --bg:10 10 12;--card:20 20 24;--card2:27 27 33;--fg:238 238 242;--dim:148 148 158;
  --line:255 255 255;--acc:255 86 60;--acc2:255 138 66;--accRgb:255 86 60;
  --safe:env(safe-area-inset-bottom,0px);
}
html.light{
  --bg:247 247 250;--card:255 255 255;--card2:240 240 245;--fg:24 24 30;--dim:118 118 132;
  --line:17 17 24;
}
html.light .card .cnt{background:rgba(0,0,0,.68)}
html.light .sheet .mask{background:rgba(0,0,0,.42)}
html.light #toast{background:rgba(28,28,34,.92)}
html.light .fabs button{box-shadow:0 8px 22px rgba(20,20,30,.16)}
html.light .card .ph.nopic::after{color:rgba(var(--line),.2)}
html.light .chip.on,html.light .icon.on{color:#fff}
html.light .vcard .pgrad{background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.7))}
html,body{margin:0;padding:0}
body{
  background:rgb(var(--bg));color:rgb(var(--fg));
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:calc(28px + var(--safe));overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}

/* ---------- 顶部 ---------- */
.head{position:sticky;top:0;z-index:60;background:rgb(var(--bg));border-bottom:1px solid rgba(var(--line),.07)}
.top{
  display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
}
.brand{font-size:19px;font-weight:900;letter-spacing:.5px;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:9.5px;font-weight:600;color:rgb(var(--dim));letter-spacing:1.6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{font-style:normal;color:rgb(var(--accRgb));margin-left:2px}
.sp{flex:1}
.icon{
  height:32px;min-width:32px;padding:0 11px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(var(--line),.08);color:rgb(var(--fg));font-size:12.5px;font-weight:700;gap:4px;
}
.icon:active{transform:scale(.96)}
.icon.on{background:rgb(var(--accRgb));color:#fff}

/* ---------- 站点条 ---------- */
.sitebar{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px 14px 9px;border-bottom:1px solid rgba(var(--line),.05);
  -webkit-overflow-scrolling:touch;
}
.sitebar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  height:30px;padding:0 12px;border-radius:15px;white-space:nowrap;
  background:rgba(var(--line),.06);color:rgb(var(--dim));
  font-size:12.5px;font-weight:700;border:1px solid transparent;
}
.chip b{font-weight:800;color:inherit}
.chip .dot{width:6px;height:6px;border-radius:3px;background:rgb(var(--dim));opacity:.55}
.chip.on{color:#fff;background:rgb(var(--accRgb));box-shadow:0 4px 14px -6px rgb(var(--accRgb))}
.chip.on .dot{background:#fff;opacity:.9}
.chip.agg{background:linear-gradient(135deg,rgb(var(--accRgb)),rgb(var(--acc2)));color:#fff}
.chip.agg .dot{background:#fff}

/* ---------- 分类页签 ---------- */
.tabs{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:2px 14px 9px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;height:30px;padding:0 13px;border-radius:15px;white-space:nowrap;
  background:rgba(var(--line),.05);color:rgb(var(--dim));font-size:13px;font-weight:700;
  display:flex;align-items:center;
}
.tab.on{background:rgba(var(--accRgb),.16);color:rgb(var(--accRgb));border:1px solid rgba(var(--accRgb),.35)}

/* ---------- 搜索 ---------- */
.searchwrap{display:none;padding:0 14px 10px;gap:8px;background:rgb(var(--bg))}
.searchwrap.on{display:flex}
.searchwrap input{
  flex:1;height:38px;border-radius:19px;border:1px solid rgba(var(--line),.1);
  background:rgba(var(--line),.05);padding:0 14px;outline:none;color:rgb(var(--fg));
}
.searchwrap button{height:38px;padding:0 16px;border-radius:19px;background:rgb(var(--accRgb));color:#fff;font-weight:800}

/* ---------- 列表 ---------- */
main{padding:4px 14px 20px;min-height:60vh}
.sec-h{display:flex;align-items:center;gap:8px;margin:14px 2px 10px;font-size:15px;font-weight:800}
.sec-h span{color:rgb(var(--dim));font-weight:600;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{
  position:relative;border-radius:14px;overflow:hidden;background:rgb(var(--card));
  border:1px solid rgba(var(--line),.06);display:block;
  transition:transform .12s ease;
}
.card:active{transform:scale(.985)}
.card .ph{position:relative;width:100%;aspect-ratio:4/3;background:rgb(var(--card2));overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s}
.card .ph img.ready{opacity:1}
.card .cnt{
  position:absolute;right:6px;bottom:6px;z-index:2;padding:1px 6px;border-radius:9px;
  background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;backdrop-filter:blur(4px);
  white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;
}
.card .siteflag{
  position:absolute;left:6px;top:6px;z-index:2;padding:2px 7px;border-radius:9px;
  background:rgba(var(--accRgb),.92);color:#fff;font-size:10px;font-weight:800;letter-spacing:.3px;
}
.card .meta{padding:8px 9px 10px}
.card .t{
  font-size:13px;font-weight:700;line-height:1.42;color:rgb(var(--fg));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.card .tg{margin-top:5px;font-size:10.5px;color:rgb(var(--dim));display:flex;gap:6px;align-items:center;overflow:hidden}
.card .tg em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.card .tg b{font-weight:700;color:rgba(var(--accRgb));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.card .ph.err::after{
  content:"封面加载失败";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--dim));font-size:11px;
}
.card .ph.nopic{
  background:radial-gradient(120% 120% at 20% 10%,rgba(var(--accRgb),.22),transparent 60%),
             linear-gradient(160deg,rgb(var(--card2)),rgb(var(--card)));
}
.card .ph.nopic::after{
  content:"吃瓜";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;letter-spacing:3px;color:rgba(var(--line),.22);
}

/* 骨架 */
.sk{border-radius:14px;background:rgb(var(--card));overflow:hidden;border:1px solid rgba(var(--line),.05)}
.sk .a{width:100%;aspect-ratio:4/3;background:linear-gradient(100deg,rgb(var(--card2)) 20%,rgba(var(--line),.09) 40%,rgb(var(--card2)) 60%);background-size:220% 100%;animation:sh 1.15s infinite linear}
.sk .b{height:12px;margin:10px 9px;border-radius:6px;background:rgba(var(--line),.07)}
.sk .c{height:12px;margin:0 9px 12px;width:62%;border-radius:6px;background:rgba(var(--line),.05)}
@keyframes sh{to{background-position:-120% 0}}

/* 分页 */
.pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:22px 0 6px}
.pager button{
  height:36px;padding:0 18px;border-radius:18px;background:rgba(var(--line),.07);
  color:rgb(var(--fg));font-size:13px;font-weight:700;border:1px solid rgba(var(--line),.08);
}
.pager button.on{background:rgb(var(--accRgb));color:#fff;border-color:transparent}
.pager button[disabled]{opacity:.35}
.pg-info{font-size:12px;color:rgb(var(--dim));font-weight:700;padding:0 4px}

/* 状态面板 */
.state{padding:46px 20px;text-align:center;color:rgb(var(--dim))}
.state .em{font-size:34px;margin-bottom:10px;opacity:.85}
.state h4{margin:0 0 6px;color:rgb(var(--fg));font-size:15px;font-weight:800}
.state .hint{font-size:12px;line-height:1.7;word-break:break-all;opacity:.85}
.state .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.state .acts button{height:36px;padding:0 16px;border-radius:18px;background:rgba(var(--line),.08);color:rgb(var(--fg));font-size:13px;font-weight:700}
.state .acts button.pri{background:rgb(var(--accRgb));color:#fff}

/* ---------- 详情 ---------- */
.art{padding:2px 0 10px}
.postback{display:flex;justify-content:flex-start;margin:0 2px 4px}
.postback button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px 0 10px;border-radius:16px;background:rgba(var(--line),.07);border:1px solid rgba(var(--line),.08);color:rgb(var(--fg));font-size:12.5px;font-weight:700}
.postback button:active{transform:scale(.97)}
.postback .ar{font-size:17px;line-height:1;margin-top:-1px}
.art h1{margin:10px 2px 8px;font-size:20px;line-height:1.42;font-weight:900;letter-spacing:.2px}
.ameta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 2px 12px;font-size:11.5px;color:rgb(var(--dim))}
.ameta b{
  font-weight:700;color:rgb(var(--accRgb));background:rgba(var(--accRgb),.12);
  padding:2px 8px;border-radius:9px;
}
.dcover{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:rgb(var(--card2));margin-bottom:12px}
.dcover img{width:100%;height:100%;object-fit:cover}
.dacts{display:flex;gap:8px;margin:0 0 14px}
.dacts button{
  flex:1;height:40px;border-radius:12px;background:rgba(var(--line),.07);color:rgb(var(--fg));
  font-size:13px;font-weight:800;border:1px solid rgba(var(--line),.07);
}
.dacts button.pri{background:linear-gradient(135deg,rgb(var(--accRgb)),rgb(var(--acc2)));color:#fff;border-color:transparent}
.dacts button:active{transform:scale(.98)}

.body{font-size:15.5px;line-height:1.82;color:rgb(var(--fg));word-break:break-word}
.body p{margin:0 0 14px}
.body h2{
  margin:20px 0 10px;font-size:16.5px;line-height:1.5;font-weight:800;
  padding-left:10px;border-left:3px solid rgb(var(--accRgb));
}
.body .pic{margin:12px 0 14px;border-radius:12px;overflow:hidden;background:rgb(var(--card2));position:relative;min-height:60px}
.body .pic img{width:100%;height:auto;opacity:0;transition:opacity .3s}
.body .pic img.ready{opacity:1}
.body .pic.err::after{
  content:"图片解密失败 · 下拉重试";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:rgb(var(--dim));
}
.body .pic .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgb(var(--dim))}

.vcard{
  position:relative;margin:14px 0;border-radius:13px;overflow:hidden;background:rgb(var(--card));
  border:1px solid rgba(var(--line),.07);
}
.vcard .ph{position:relative;width:100%;aspect-ratio:16/9;background:rgb(var(--card2))}
.vcard .ph img{width:100%;height:100%;object-fit:cover;opacity:.9}
.vcard .pgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.72))}
.vcard .play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.4);
}
.vcard .play::after{
  content:"";width:0;height:0;margin-left:3px;
  border-left:15px solid #111;border-top:9px solid transparent;border-bottom:9px solid transparent;
}
.vcard .vt{
  position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:12.5px;font-weight:700;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.vcard .badge{
  position:absolute;left:10px;top:8px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.55);
  color:#fff;font-size:10px;font-weight:800;backdrop-filter:blur(4px);
}
.near{display:flex;gap:10px;margin:20px 0 6px}
.near a{
  flex:1;padding:10px 12px;border-radius:12px;background:rgb(var(--card));
  border:1px solid rgba(var(--line),.06);font-size:12.5px;color:rgb(var(--dim));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.near a b{display:block;color:rgb(var(--fg));font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;
  background:rgb(var(--card));border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--safe));
  animation:up .2s ease;
}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 12px;font-size:15px;font-weight:800}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{
  height:32px;padding:0 13px;border-radius:16px;background:rgba(var(--line),.07);
  font-size:13px;font-weight:700;color:rgb(var(--fg));
}
.cats button.on{background:rgb(var(--accRgb));color:#fff}
#toast{
  position:fixed;left:50%;bottom:calc(38px + var(--safe));transform:translate(-50%,14px);
  background:rgba(0,0,0,.86);color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;
  z-index:120;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:30px 0;color:rgb(var(--dim));font-size:12.5px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(var(--line),.18);border-top-color:rgb(var(--accRgb));animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- 浮动按钮 & 图片全屏 ---------- */
.fabs{
  position:fixed;right:12px;bottom:calc(18px + var(--safe));z-index:80;
  display:flex;flex-direction:column;gap:9px;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease;
}
.fabs.on{opacity:1;transform:none;pointer-events:auto}
.fabs button svg{width:19px;height:19px;fill:rgb(var(--fg));display:block;pointer-events:none}
.fabs button{
  width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;
  background:rgba(var(--card2),.94);border:1px solid rgba(var(--line),.13);color:rgb(var(--fg));
  font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 8px 22px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.fabs button:active{transform:scale(.93)}
.fabs .up::after{
  content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:9px solid rgb(var(--fg));
}
.fabs .up{margin-top:2px}
.fabs .up i{display:none}
.zoom{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:none;
  align-items:center;justify-content:center;
}
.zoom.on{display:flex}
.zoom img{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;display:block}
.zoom .zhint{
  position:absolute;left:0;right:0;bottom:calc(18px + var(--safe));text-align:center;
  color:rgba(255,255,255,.5);font-size:12px;pointer-events:none;
}
.body .pic img,.dcover img,.vcard .ph img{cursor:zoom-in}
</style>
</head>
<body>
<div class="head">
<header class="top">
  <div class="brand" id="brand">多聚<i>吃瓜</i><small>SUPER AGG</small></div>
  <div class="sp"></div>
  <button class="icon" id="btnTheme" data-act="theme" aria-label="切换深浅色" title="切换深浅色">☀</button>
  <button class="icon" id="btnCat" data-act="sheet">分类</button>
  <button class="icon" id="btnSearch" data-act="searchToggle">搜索</button>
</header>
<div class="sitebar" id="siteBar"></div>
<nav class="tabs" id="tabs"></nav>
<div class="searchwrap" id="searchWrap">
  <input id="q" type="search" inputmode="search" placeholder="搜索当前站点…" autocomplete="off">
  <button id="doSearch">搜索</button>
</div>
</div>
<main id="view"></main>
<div class="sheet" id="sheet">
  <div class="mask" data-act="closeSheet"></div>
  <div class="panel">
    <h3 id="sheetTitle">全部分类</h3>
    <div class="cats" id="catList"></div>
  </div>
</div>
<div class="fabs" id="fabs"><button data-act="top" class="ico" aria-label="回到顶部" title="回到顶部"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5l7.5 7.5h-4.6v7.5h-5.8V12H4.5z"/></svg></button><button data-act="back" class="ico" aria-label="返回上一页" title="返回上一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.6l1.7 1.7-4.2 4.2h12.6v2.4H7.8l4.2 4.2-1.7 1.7L4.2 12z"/></svg></button></div>
<div id="toast"></div>
<script>

(function () {
  'use strict';

  /* =========================================================================
     多聚吃瓜 · 超级聚合（单文件，无外部依赖）
     一个 html 里内置 9 个吃瓜站的完整解析规则：
       · 列表卡片（Mirages post-card / 69 系 videoBox / 通用锚点兜底）
       · 正文图文混排（text / img / video 块流，等价 hl365 的阅读体验）
       · 封面与正文图 AES-128-CBC 解密（f5d965df…-97b60394…）
       · 多通道请求（宿主桥 fm.req / ds.req、直连、代理）
       · 视频推送（fm.vodInline → fm.play → 复制直链）
     ========================================================================= */

  var VERSION = '2.1.0';

  /* ---------------- 站点表 ----------------
     顺序 = 实测访问质量（响应速度 + 稳定性 + 模板解析成功率），第一个即默认进入的站；
     host 为官方入口，alt 为备用入口（整站换域名时自动跟随 302 / 逐个重试） */
  var SITES = [
    { k: 'npvwzxaa',  n: '黑料不打烊', sh: '不打烊', host: 'https://cash.npvwzxaa.cc', theme: '#ef4444',
      alt: ['https://npvwzxaa.cc'] },
    { k: 'ttrgw',     n: '天天热瓜网', sh: '热瓜', host: 'https://ttrgw.com', theme: '#22c55e',
      alt: ['https://www.ttrgw.com', 'https://d37qf727nkuhs2.cloudfront.net'] },
    { k: 'bcvvoekm',  n: '黑料吃瓜网', sh: '黑吃', host: 'https://ad.bcvvoekm.cc', theme: '#ff8a42',
      alt: ['https://bcvvoekm.cc'] },
    { k: 'kxjfbrxf',  n: '51吃瓜网',   sh: '51',   host: 'https://boss.kxjfbrxf.cc', theme: '#3ea6ff',
      alt: ['https://access.lagrroutb.cc', 'https://barely.lagrroutb.cc'] },
    { k: 'd1k1',      n: '911爆料网',  sh: '911',  host: 'https://d1k1nd82ice0a7.cloudfront.net', theme: '#f59e0b' },
    { k: 'd36u',      n: '69吃瓜网',   sh: '69',   host: 'https://d36u6vspl7fx0l.cloudfront.net', theme: '#06b6d4',
      alt: ['https://69cgua.com'] },
    { k: 'cg91',      n: '91吃瓜网',   sh: '91',   host: 'https://www.91cg1.com', theme: '#ff4d6d',
      alt: ['https://91cg1.com'] },
    { k: 'heiliaodi', n: '黑料帝',     sh: '料帝', host: 'https://heiliaodi.com', theme: '#a855f7',
      alt: ['https://www.heiliaodi.com'] }

    if (res && typeof res.byteLength === 'number' && typeof res.slice === 'function') {
      try { return new Uint8Array(res); } catch (e) {}
    }
    if (res && res.buffer && typeof res.BYTES_PER_ELEMENT === 'number') {
      try { return new Uint8Array(res.buffer, res.byteOffset || 0, res.byteLength); } catch (e) {}
    }
    if (typeof res === 'string') {
      if (/^[A-Za-z0-9+/=\s]+$/.test(res.slice(0, 200)) && res.length > 64) return b64ToBytes(res);
      return null;
    }
    if (typeof res === 'object') {
      if (typeof res.base64 === 'string') return b64ToBytes(res.base64);
      if (typeof res.data === 'string') return b64ToBytes(res.data);
      if (res.data instanceof ArrayBuffer) return new Uint8Array(res.data);
      if (res.body) return asBytes(res.body);
    }
    return null;
  }

  function fetchImgBytes(url) {
    var list = [];
    if (window.ds && typeof window.ds.req === 'function') {
      list.push(function () { return window.ds.req(url, { responseType: 'base64' }); });
    }
    if (window.fm && typeof window.fm.req === 'function') {
      list.push(function () { return window.fm.req(url, { responseType: 'base64' }); });
    }
    list.push(function () {
      var ref = (/^https?:\/\/[^\/]+/i.exec(url) || [''])[0];
      return fetch(url, { headers: { 'user-agent': UA, 'referer': ref ? ref + '/' : '' }, credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        });
    });
    list.push(function () {
      /* 纯浏览器里图片 CDN 一般不给 CORS 头，退回代理线路 */
      return fetch(proxied(url), { credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        });
    });
    function step(i) {
      if (i >= list.length) return Promise.reject(new Error('图片请求失败'));
      return withTimeout(Promise.resolve(list[i]()), 20000).then(function (res) {
        var b = asBytes(res);
        if (!b || !b.length) throw new Error('empty');
        return b;
      }).catch(function () { return step(i + 1); });
    }
    return step(0);
  }

  function decodeImage(url) {
    return fetchImgBytes(url).then(function (bytes) {
      if (isImg(bytes)) return bytes;
      /* ① XOR 前 100 字节（69吃瓜网等自研站） */
      var x = null;
      try { x = xorHead(bytes, XOR_KEY); } catch (e) { x = null; }
      if (x && isImg(x)) return x;
      /* ② AES-128-CBC（Mirages 系站点，pic.nsxxlj.cn / pic.gyezbp.cn 等） */
      var plain = null;
      try { plain = AES(bytes, IMG_KEY, IMG_IV); } catch (e) { plain = null; }
      if (plain && isImg(plain)) return plain;
      return bytes;
    });
  }

  function toBlobUrl(bytes) {
    try {
      var blob = new Blob([bytes], { type: mimeOf(bytes) });
      if (window.URL && URL.createObjectURL) return URL.createObjectURL(blob);
    } catch (e) {}
    try { return 'data:' + mimeOf(bytes) + ';base64,' + bytesToB64(bytes); } catch (e) { return ''; }
  }

  var imgQ = [], imgRun = 0, IMG_MAX = 5;

  function pumpImg() {
    while (imgRun < IMG_MAX && imgQ.length) {
      (function (img) {
        imgRun++;
        var url = img.getAttribute('data-img') || '';
        var box = img.parentNode;
        function finish(src) {
          imgRun--;
          if (src) {
            img.src = src;
            img.className = String(img.className).replace(/\s*err/g, '') + ' ready';
            if (box && box.className) box.className = String(box.className).replace(/\s*err/g, '');
          } else if (box && box.className && box.className.indexOf('err') < 0) {
            box.className += ' err';
          }
          pumpImg();
        }
        if (!url) { finish(''); return; }
        decodeImage(url).then(function (bytes) {
          if (!isImg(bytes)) { finish(''); return; }   /* 解不出来 → 走占位图，不显示破图 */
          var src = toBlobUrl(bytes);
          finish(src || url);
        }).catch(function () { finish(url); });
      })(imgQ.shift());
    }
  }

    if (!route || route._autoRetry) return false;
    route._autoRetry = 1;
    toast('连接不稳定，正在自动重试…');

  function renderList(route) {
    if (!SITE_MAP[route.site]) route.site = SITES[0].k;
    var view = $('view');
    var siteName = cfgOf(route.site).n;
    view.innerHTML = '<div class="sec-h">' + esc(titleOf(route)) + '<span>正在加载</span></div>' +
                     skeletonHTML(6) +
                     '<div class="loading"><i class="spin"></i><span>连接 ' + esc(siteName) + ' …</span></div>';
    var base = baseOf(route.site);
    var url = listUrl(route, base);
    paintTabs(route);

    var meta = {};
    return req(url, { meta: meta }).then(function (html) {
      if (looksBlocked(html)) throw cfErr(url);
      /* 只认 302 后的真实域名；页面里的 canonical/og:url 常指向打不开的镜像域名，不能信 */
      var finOrigin = meta.url ? (/^https?:\/\/[^\/]+/i.exec(meta.url) || [''])[0] : '';
      if (finOrigin && finOrigin.replace(/\/+$/, '') !== String(base).replace(/\/+$/, '') && !route._fixed) {
        setBase(route.site, finOrigin);
        route._prevBase = base;
        route._fixed = 1;
        if (route.url) { delete route.url; }
        return renderList(route);
      }
      var cards = parseCards(html, base);
      /* 换了域名却解析不到东西 → 回退到原域名 */
      if (!cards.length && route._fixed === 1 && route._prevBase) {
        setBase(route.site, route._prevBase);
        route._prevBase = '';
        route._fixed = 2;
        if (route.url) { delete route.url; }
        return renderList(route);
      }
      var next = parseNext(html, url);
      var pg = parsePager(html);
      if (!next && cards.length >= 3 && (!pg.total || route.page < pg.total)) {
        /* 有些站（swiper 分页）页面里没有可点的「下一页」，靠 URL 规律合成 */
        next = buildPageUrl(route, route.page + 1) || '';
      }
      if (next) S.pageUrls[pkey(route.site, route.kind, route.slug, route.page + 1)] = next;
      if (route.page > 1) S.pageUrls[pkey(route.site, route.kind, route.slug, route.page)] = url;
      if (!S.pageUrls[pkey(route.site, route.kind, route.slug, 1)] && route.page === 1) {
        S.pageUrls[pkey(route.site, route.kind, route.slug, 1)] = url;
      }
      var cats = parseCats(html, base);
      if (cats.length > 3 && !isAgg(route.site)) {
        S.cats[route.site] = cats;
        if (route.kind === 'home') paintTabs(route);
      }
      if (!cards.length) {
        if (autoRetry(route, renderList)) {
          view.innerHTML = '<div class="sec-h">' + esc(titleOf(route)) + '</div>' + skeletonHTML(3) +
            '<div class="loading"><i class="spin"></i><span>页面为空，正在自动重试…</span></div>';
          return;
        }
        view.innerHTML = '<div class="sec-h">' + esc(titleOf(route)) + '</div>' +
          '<div class="state"><div class="em">🕳️</div><h4>没有更多内容了</h4>' +
          '<div class="hint">该页可能是空列表、验证码页，或站点模板已改版。<br>' + esc(url) + '</div>' +
          '<div class="acts">' + (route.page > 1 ? '<button class="pri" data-act="page" data-page="' + (route.page - 1) + '">返回上一页</button>' : '') +
          '<button' + (route.page > 1 ? '' : ' class="pri"') + ' data-act="retry">重试</button>' +
          '<button data-act="proxy">' + (S.forceProxy ? '改用直连' : '改用代理') + '</button></div></div>';
        return;
      }
      route._autoRetry = 0;
      var out = '<div class="sec-h">' + esc(titleOf(route)) + '<span>' + cards.length + ' 条' + '</span></div>';
      out += '<div class="grid">' + cards.map(function (c) { return cardHTML(c, route.site); }).join('') + '</div>';
      out += pagerHTML(route, !!next);
      view.innerHTML = out;
      hydrate(view);
      window.scrollTo(0, 0);
    }).catch(function (e) {
      if (route._fixed === 1 && route._prevBase) {
        setBase(route.site, route._prevBase);
        route._prevBase = '';
        route._fixed = 2;
        if (route.url) { delete route.url; }
        return renderList(route);
      }
      /* 主域名打不开 → 依次换备用域名（站点经常整站换域名） */
      var alts = hostList(route.site);
      route._altIdx = route._altIdx || 0;

        var alt = alts[route._altIdx++];
        if (alt.replace(/\/+$/, '') === String(baseOf(route.site)).replace(/\/+$/, '')) continue;
        setBase(route.site, alt);
        if (route.url) { delete route.url; }
        route._fixed = 3;
        return renderList(route);
      }
      if (autoRetry(route, renderList)) {
        view.innerHTML = '<div class="sec-h">' + esc(titleOf(route)) + '</div>' + skeletonHTML(3) +
          '<div class="loading"><i class="spin"></i><span>连接不稳定，正在自动重试…</span></div>';
        return;
      }
      view.innerHTML = '<div class="sec-h">' + esc(titleOf(route)) + '</div>' + errHTML(e);
    });
  }

      startIndex: i,
      mark: 1,
      header: { 'referer': post.url, 'user-agent': UA }
    };
    var fm = window.fm || {}, ds = window.ds || {};
    try {
      if (typeof fm.vodInline === 'function') { fm.vodInline(payload); toast('已推送：' + short(post.title, 18)); return; }
      if (typeof fm.play === 'function') { fm.play(payload); toast('已推送：' + short(post.title, 18)); return; }
      if (typeof ds.play === 'function') { ds.play(payload); toast('已推送：' + short(post.title, 18)); return; }
    } catch (e) {
      toast('推送失败：' + (e.message || e));
      return;
    }
    copyText(post.videos[i].url);
    toast('已复制视频直链（无宿主桥）');
  }

  /* ---------------- 路由 ---------------- */
  function hashOf(route) {
    var parts = ['#/' + route.t + '/' + route.site];
    if (route.t === 'post') {
      parts.push(encodeURIComponent(route.id || route.url));
    } else {
      parts.push(route.kind || 'home');
      if (route.slug) parts.push(encodeURIComponent(route.slug));
      parts.push('p' + (route.page || 1));
    }
    return parts.join('/');
  }

  function routeFromHash() {
    var h = String(location.hash || '').replace(/^#\/?/, '');
    if (!h) return null;
    var p = h.split('/');
    var t = p[0], site = p[1];
    if (!t || !site || !SITE_MAP[site]) return null;
    if (t === 'post') {
      var id = decodeURIComponent(p.slice(2).join('/'));
      return { t: 'post', site: site, id: id, url: /^https?:/.test(id) ? id : '' };
    }
    if (t === 'list') {
      var kind = p[2] || 'home';
      var page = 1;
      var slug = '';
      if (p.length >= 4) {
        if (/^p\d+$/.test(p[p.length - 1])) { page = +p[p.length - 1].slice(1); slug = decodeURIComponent(p[3] || ''); }
        else { slug = decodeURIComponent(p.slice(3).join('/')); }
      }
      return { t: 'list', site: site, kind: kind, slug: slug, page: page };
    }
    return null;
  }

  function render(route, noPush) {
    S.route = route;
    S.site = route.site;
    store.set('site', route.site);
    applyTheme(route.site);
    syncChips();
    try { document.body.className = route.t === 'post' ? 'postmode' : ''; } catch (e) {}
    paintBrand();
    if (!noPush) {
      S.stack.push(route);
      try { history.pushState({ dz: 1 }, '', hashOf(route)); } catch (e) {}
    } else {
      if (S.stack.length) S.stack[S.stack.length - 1] = route; else S.stack.push(route);
      try { history.replaceState({ dz: 1 }, '', hashOf(route)); } catch (e) {}
    }
    if (route.t === 'post') {
      if (!route.url) route.url = postUrlOf(route);
      if (!route.url) { toast('缺少文章地址'); return; }
      return renderPost(route);
    }
    return renderList(route);
  }

  /* 返回上一页：优先走内部栈，其次浏览器历史，最后退到本站首页列表 */
  function goBack() {
    var cur = S.route || {};
    if (S.stack.length > 1) {
      S.stack.pop();
      render(S.stack[S.stack.length - 1], true);
      return;
    }
    if (cur.t === 'list' && cur.kind === 'home' && (cur.page || 1) === 1) {
      toast('已经在首页了');
      return;
    }
    var site = SITE_MAP[cur.site] ? cur.site : SITES[0].k;
    render({ t: 'list', site: site, kind: 'home', page: 1 }, true);
  }

  /* ---------------- 顶部 / 页签 ---------------- */
  function buildChips() {
    var bar = $('siteBar');
    var html = '';
    for (var i = 0; i < SITES.length; i++) {
      var s = SITES[i];
      html += '<button class="chip' + (s.agg ? ' agg' : '') + '" data-act="site" data-site="' + esc(s.k) + '">' +
        '<i class="dot" style="background:' + esc(s.theme || '#ff563c') + '"></i>' + esc(s.n) + '</button>';
    }
    bar.innerHTML = html;
    syncChips();
  }
  function syncChips() {
    var bar = $('siteBar'); if (!bar) return;
    var kids = bar.querySelectorAll('.chip');
    for (var i = 0; i < kids.length; i++) {
      var on = kids[i].getAttribute('data-site') === S.site;
      kids[i].className = 'chip' + (on ? ' on' : '') + (kids[i].getAttribute('data-site') === 'agg' ? ' agg' : '');
    }
    var cur = bar.querySelector('.chip.on');
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }

  function paintTabs(route) {
    var tabs = $('tabs');
    if (!tabs) return;
    if (!route || route.site === 'agg' || route.t === 'post') { tabs.innerHTML = ''; return; }
    var cats = S.cats[route.site] || [];
    var html = '<button class="tab' + (route.kind === 'home' ? ' on' : '') + '" data-act="cat" data-kind="home">首页</button>';
    for (var i = 0; i < cats.length && i < 14; i++) {
      var c = cats[i];
      var on = route.kind !== 'home' && (route.slug === c.slug);
      html += '<button class="tab' + (on ? ' on' : '') + '" data-act="cat" data-slug="' + esc(c.slug) + '" data-name="' + esc(c.name) + '">' + esc(c.name) + '</button>';
    }
    if (cats.length > 14) html += '<button class="tab" data-act="sheet">全部分类</button>';
    tabs.innerHTML = html;
  }

  function openSheet() {
    var route = S.route || {};
    var cats = S.cats[route.site] || [];
    var box = $('catList');
    box.innerHTML = cats.length
      ? cats.map(function (c) {
          return '<button class="' + (route.slug === c.slug ? 'on' : '') + '" data-act="cat" data-slug="' + esc(c.slug) + '" data-name="' + esc(c.name) + '">' + esc(c.name) + '</button>';
        }).join('')
      : '<div class="hint" style="color:rgb(var(--dim));font-size:12px">本站在线分类尚未加载</div>';
    $('sheetTitle').textContent = cfgOf(route.site).n + ' · 全部分类';
    $('sheet').className = 'sheet on';
  }
  function closeSheet() { $('sheet').className = 'sheet'; }

  /* ---------------- 事件 ---------------- */
  /* ---------------- 图片全屏 ----------------
     正文/详情里的图点一下就全屏（用已解密好的 blob/data 地址，避免二次请求） */
  function zoomBox() {
    var z = $('zoom');
    if (!z) {
      z = document.createElement('div');
      z.id = 'zoom';
      z.className = 'zoom';
      z.innerHTML = '<img alt=""><div class="zhint">点击任意处关闭</div>';
      z.addEventListener('click', closeZoom);
      document.body.appendChild(z);
    }
    return z;
  }
  function openZoom(el) {
    var img = el && el.tagName === 'IMG' ? el : (el && el.querySelector ? el.querySelector('img') : null);
    if (!img) return;
    var src = img.getAttribute('src') || img.getAttribute('data-img') || '';
    if (!src) { toast('图片还在加载'); return; }
    var z = zoomBox();
    z.querySelector('img').src = src;
    z.className = 'zoom on';
    document.body.style.overflow = 'hidden';
  }
  function closeZoom() {
    var z = $('zoom');
    if (z) z.className = 'zoom';
    document.body.style.overflow = '';
  }

  function bind() {
    document.addEventListener('click', function (ev) {
      var el = ev.target;
      while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
      if (!el || el === document || !el.getAttribute) return;
      var act = el.getAttribute('data-act');
      var route = S.route || {};
      if (act === 'open') {
        var url = el.getAttribute('data-url');
        var site = el.getAttribute('data-site') || route.site;
        if (!url) return;
        render({ t: 'post', site: site, url: url, id: el.getAttribute('data-id') || url });
      } else if (act === 'site') {
        var k = el.getAttribute('data-site');
        render({ t: 'list', site: k, kind: 'home', page: 1 });
      } else if (act === 'cat') {
        var kind = el.getAttribute('data-kind') || 'cat';
        if (kind === 'home') render({ t: 'list', site: route.site, kind: 'home', page: 1 });
        else render({ t: 'list', site: route.site, kind: 'cat', slug: el.getAttribute('data-slug'), name: el.getAttribute('data-name'), page: 1 });
      } else if (act === 'page') {
        var n = +el.getAttribute('data-page');
        if (!n || n < 1) return;
        var k2 = pkey(route.site, route.kind, route.slug, n);
        var u = S.pageUrls[k2] || buildPageUrl(route, n);
        render({ t: 'list', site: route.site, kind: route.kind, slug: route.slug, kw: route.kw, name: route.name, page: n, url: u });
      } else if (act === 'play') {
        pushVideo(S.post, +el.getAttribute('data-i'));
      } else if (act === 'playAll') {
        pushVideo(S.post, 0);
      } else if (act === 'copySrc') {
        copyText(route.url || (S.post && S.post.url) || '');
        toast('已复制文章链接');
      } else if (act === 'sheet') {
        openSheet();
      } else if (act === 'closeSheet') {
        closeSheet();
      } else if (act === 'searchToggle') {
        var sw = $('searchWrap');
        sw.className = sw.className.indexOf('on') >= 0 ? 'searchwrap' : 'searchwrap on';
        if (sw.className.indexOf('on') >= 0) { try { $('q').focus(); } catch (e) {} }
      } else if (act === 'retry') {
        render(route, true);
      } else if (act === 'proxy') {
        S.forceProxy = !S.forceProxy;
        store.set('proxy', S.forceProxy ? '1' : '');
        toast(S.forceProxy ? '已切换代理线路' : '已切换直连线路');
        render(route, true);
      } else if (act === 'theme') {
        schemeLight = !schemeLight;
        store.set('theme', schemeLight ? 'light' : '');
        applyScheme(schemeLight);
        toast(schemeLight ? '已切换浅色' : '已切换深色');
      } else if (act === 'back') {
        goBack();
      } else if (act === 'home') {
        render({ t: 'list', site: el.getAttribute('data-site') || route.site, kind: 'home', page: 1 });
      } else if (act === 'top') {
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
      } else if (act === 'zoom') {
        openZoom(el);
      } else if (act === 'zoomClose') {
        closeZoom();
      }
    });

    /* 浮动按钮：返回顶部 / 回到首页 */
    window.addEventListener('scroll', function () {
      var fabs = $('fabs');
      if (!fabs) return;
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      fabs.className = y > 320 ? 'fabs on' : 'fabs';
    }, { passive: true });

    var q = $('q'), btn = $('doSearch');
    function doSearch() {
      var kw = String(q.value || '').trim();
      if (!kw) { toast('请输入关键词'); return; }
      var site = (S.route && SITE_MAP[S.route.site]) ? S.route.site : (SITE_MAP[S.site] ? S.site : SITES[0].k);
      render({ t: 'list', site: site, kind: 'search', kw: kw, page: 1 });
      $('searchWrap').className = 'searchwrap';
    }
    if (btn) btn.addEventListener('click', doSearch);
    if (q) q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

    window.addEventListener('popstate', function () {
      var r = routeFromHash();
      if (!r) return;
      var h = '';
      try { h = hashOf(r); } catch (e) {}
      for (var i = S.stack.length - 1; i >= 0; i--) {
        if (hashOf(S.stack[i]) === h) { S.stack.length = i + 1; break; }
      }
      render(r, true);
    });

    document.addEventListener('dsback', function () {
      goBack();
    }, false);

    document.addEventListener('error', function (ev) {
      var t = ev.target;
      if (!t || t.tagName !== 'IMG') return;
      if (t.getAttribute('data-of')) return;
      t.setAttribute('data-of', '1');
      var box = t.parentNode;
      if (box && String(box.className).indexOf('err') < 0) box.className += ' err';
    }, true);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    S.forceProxy = store.get('proxy', isNative() ? '0' : '1') === '1';
    var last = store.get('site', SITES[0].k);
    S.site = SITE_MAP[last] ? last : SITES[0].k;
    SITES.forEach(function (s) {
      if (s.agg) return;
      var b = store.get('base_' + s.k, '');
      if (b && /^https?:\/\//.test(b)) S.base[s.k] = b;
    });
    buildChips();
    bind();
    applyTheme(S.site);
    applyScheme();
    paintBrand();
    var r = routeFromHash() || { t: 'list', site: S.site, kind: 'home', page: 1 };
    S.stack.length = 0;
    render(r, false);
    try { history.replaceState({ dz: 1 }, '', hashOf(r)); } catch (e) {}
  }

  window.__app = {
    VERSION: VERSION, S: S, SITES: SITES, render: render, req: req,
    parseCards: parseCards, parsePost: parsePost, parseCats: parseCats, parseNext: parseNext,
    decodeImage: decodeImage, hydrate: hydrate, pushVideo: pushVideo, aes: AES,
    baseOf: baseOf, setBase: setBase, hashOf: hashOf, resolvePacked: resolvePacked, articleVideos: articleVideos, routeFromHash: routeFromHash,
    hostList: hostList
  };

  if (typeof document !== 'undefined' && document.addEventListener) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
</body>
</html>
